# CBS Nieuw Bestand Bodemgebruik (NBBG), mutatiebestand NBBG2022 v1:
# one polygon layer carrying both the 2020 (`NBBG20`) and the 2022 (`NBBG22`)
# category, consistently corrected so the two years are comparable.
#
# Source: https://geodata.cbs.nl/files/Bodemgebruik/NBBG2022/
#   CBS_Mutatiebestand_NBBG2022_v1_def_GPKG.zip (layer *_dissolved)
#
# Output per hex and per category: `bbg_<slug>_fraction` = share of the hex
# area with that land use (all categories together sum to ~1 wherever the
# hex is covered by the map; `bbg_coverage` holds that sum).
#
# Code -> label from the CBS QGIS style file (CBS_NBBG2022_stijlbestand_v1.qml).

[years]
NBBG20 = 2020
NBBG22 = 2022

