# Which column to use for what: rendered into GUIDE.md in every release (release.py), which also
# checks that every column named here exists in the cube. The cube carries several sources for some
# concepts, with different definitions; a consumer should pick ONE per concept. `trend` says whether
# year-to-year differences are real change:
#   ok    = consistent source and method over the cube's years
#   care  = mostly real, with a known step or gap (see note)
#   no    = differences are dominated by method/edition changes or the column is static
#
# Per-column warnings are in <cube>.columns.json; detected steps per release are in diff.md.
# `covers` (glob patterns) and `covers_source` (start of a column's source) list the further columns a
# concept's note applies to, so release.py can tell documented steps from new ones.

[[concept]]
name = "Inhabitants, age groups, households"
use = ["aantal_inwoners_sum", "aantal_inwoners_0_tot_15_jaar_sum", "aantal_inwoners_65_jaar_en_ouder_sum", "aantal_part_huishoudens_sum"]
covers = ["aantal_*_sum", "cbs_coverage", "bijgeschat_*"]
trend = "care"
note = "CBS 100 m squares, real totals. Age, sex and household-type groups add up to the totals: parts CBS suppressed (< 5 per square) are filled in (bijgeschat_*_sum says how many per cell; ~4.5% of people for age, 8% of households). 2025 is CBS's preliminary v1: more suppressed squares (count as 0), births not published (empty), and ~30% more squares listed (cbs_coverage 0.17 -> 0.22, mostly squares without residents): treat 2025 as provisional."

[[concept]]
name = "Number of homes"
use = ["num_woonfunctie"]
alternatives = ["aantal_woningen_sum"]
trend = "ok"
note = "BAG addresses with a residential function on 1 January, exact counts every year. CBS aantal_woningen_sum agrees (r 0.995) but has suppressed squares; use it only next to other CBS columns of the same square."

[[concept]]
name = "Housing stock by construction period, ownership, energy use"
use = ["aantal_woningen_bouwjaar_voor_1945_sum", "percentage_koopwoningen_area_weighted_average", "gemiddeld_gasverbruik_woning_area_weighted_average"]
covers = ["aantal_woningen_*", "percentage_koop*", "percentage_huur*", "gemiddeld_*_woning_*"]
trend = "care"
note = "CBS squares; construction-period classes add up to aantal_woningen_sum (suppressed classes filled in, bijgeschat_bouwjaar_sum). CBS changed the construction-period classes in 2025 (15_en_later is summed back from 15_tot_25 + 25_en_later). Gas and electricity use are not published in 2025 (empty)."

[[concept]]
name = "Gas-heated and gas-free homes (2024 only)"
use = ["wb_perc_aardgaswoningen", "wb_perc_aardgasvrije_woningen"]
alternatives = ["wb_perc_aardgaswoningen_eigen_buurt", "wb_perc_aardgasvrije_woningen_eigen_buurt", "wb_perc_woningen_stadsverwarming"]
covers = ["wb_perc_aardgas*"]
trend = "no"
note = "CBS Kerncijfers wijken en buurten 2024, per buurt: % homes heated mainly by an individual or block gas boiler (no electric or district heating found) and % homes without gas delivery (electric and/or district heat). Only the 2024 kaart has them: CBS built the method (electric heating from monthly electricity use) in 2024, so there is no series; other years are empty. Rounding and suppression mean the two don't add to 100 (mean ~92). Buurten with < 100 homes (~30%, mostly rural) are suppressed and take their wijk's value, else the gemeente's (_eigen_buurt = share of the cell with the buurt's own value; ~half the land area). Gas-free share vs wb_perc_woningen_stadsverwarming: r 0.78."

[[concept]]
name = "House value"
use = ["gemiddelde_woz_waarde_woning_area_weighted_average"]
alternatives = ["wb_gemiddelde_woningwaarde"]
trend = "ok"
note = "CBS squares, x 1000 euro. The wb_ version is per buurt (coarser)."

[[concept]]
name = "Income and poverty"
use = ["wb_perc_huishoudens_laag_inkomen", "wb_gemiddeld_inkomen_per_inwoner", "wb_gemiddeld_inkomen_per_inwoner_eigen_buurt"]
alternatives = ["wb_perc_personen_laag_inkomen", "mediaan_inkomen_huishouden_area_weighted_average"]
covers = ["wb_*", "mediaan_inkomen_*"]
trend = "care"
note = "Buurt level (wb_), 2018-2023 only; 2024-2025 empty (not published yet): carry 2023 forward game-side. wb_perc_huishoudens_laag_inkomen is published for buurten with ~99% of residents in every year: the most reliable income column. From 2019 on CBS publishes the AVERAGE incomes (wb_gemiddeld_inkomen_*, wb_gestandaardiseerd_*) for only ~14% of buurten; the cube fills the rest from the wijk, else the gemeente value, so these columns are complete but coarser from 2019: <column>_eigen_buurt = share of the cell with the buurt's own value (2018 ~0.8, 2019+ ~0.2 in zh). Don't read the 2018 -> 2019 change in local detail as real. All wb_ indicators arrive with a delay (income/labour/wealth empty from 2024, most others from 2025), and CBS changed the wealth and purchasing-power definitions in 2022 (wb_mediaan_vermogen_huishoudens +27%, wb_perc_huishoudens_lage_koopkracht -40%). Wijk- en Buurtkaart 2021 has a wrong percentage unmarried; the cube recomputes it from the other three marital-status shares. The per-square median income class exists only for 2018-2019, do not use it for trends."

[[concept]]
name = "Liveability"
use = ["lbm_score", "lbm_fysieke_omgeving", "lbm_overlast_onveiligheid"]
trend = "care"
note = "Leefbaarometer is measured every 2 years (2018/2020/2022/2024); odd years repeat the previous measurement (lbm_source_year), so values step every other year."

[[concept]]
name = "Distance to services"
use = ["dichtstbijzijnde_huisartsenpraktijk_afstand_in_km_min", "dichtstbijzijnde_basisonderwijs_afstand_in_km_min", "dichtstbijzijnde_grote_supermarkt_afstand_in_km_min"]
trend = "care"
covers = ["dichtstbijzijnde_*", "*_aantal_binnen_*"]
note = "All dichtstbijzijnde_* and *_aantal_binnen_* are empty in 2025 (CBS v1 has no distances) and huisartsenpost also in 2024: carry the last year forward game-side. Null also means 'no residents in the square', not 'far away'."

[[concept]]
name = "Land use, per year (cover)"
use = ["lgn_groep_agrarisch_grasland", "lgn_groep_akkerbouw", "lgn_groep_bebouwing", "lgn_groep_wegen", "lgn_groep_stedelijk_groen", "lgn_groep_bos", "lgn_groep_natuur_open", "lgn_groep_water"]
covers = ["lgn_groep_*"]
covers_source = "LGN"
alternatives = ["landgebruiksklasse", "agrarisch_gras_fraction"]
trend = "care"
note = "LGN groups sum to lgn_coverage. Single LGN classes jump with LGN's method: LGN2021 remapped nature, forest and the coast (bos +39%, kwelders x5, struikvegetatie), split roads into 3 classes; LGN2022 has +50% roads; class 45 natural grassland nearly vanishes in 2022-2023. Use the groups for time series, and even then treat lgn_groep_wegen 2022 and the 2021 nature/forest groups as method steps."

[[concept]]
name = "Land use, functional (residential, business, recreation)"
use = ["bbg_woonterrein_fraction", "bbg_bedrijfsterrein_fraction"]
covers = ["bbg_*"]
trend = "no"
note = "CBS NBBG has two editions (2020, 2022): 2018-2021 repeat 2020, 2022-2025 repeat 2022 (bbg_source_year). NBBG counts whole sites (gardens, streets), so its built-up share is ~3x LGN's; never mix with LGN for one concept."

[[concept]]
name = "Built-up / buildings"
use = ["bag3d_bebouwd_fraction", "bag3d_footprint_m2", "bag3d_volume_m3", "bag3d_hoogte_gem_m"]
alternatives = ["lgn_groep_bebouwing", "num_verblijfsobjecten"]
trend = "no"
note = "3D BAG is one snapshot (2024) repeated in every year: building geometry, not a time series. For change in buildings over time use num_* (BAG, yearly) or lgn_groep_bebouwing."

[[concept]]
name = "Crops and agriculture"
use = ["brp_grasland_fraction", "brp_mais_fraction", "brp_aardappelen_fraction", "brp_coverage"]
covers = ["brp_*"]
alternatives = ["lgn_groep_akkerbouw"]
trend = "ok"
note = "BRP registered parcels, yearly and consistent (LGN takes its crops from BRP). brp_coverage = share of the cell that is registered farmland. Small groups follow policy: the 2023 CAP rules (4% non-productive land) raised braak and voedergewassen and shrank 'overig'; those are real, rule-driven changes."

[[concept]]
name = "Grassland for nitrogen (intensive vs extensive)"
use = ["brp_grasland_fraction", "brp_natuurlijk_grasland_fraction"]
alternatives = ["lgn_groep_agrarisch_grasland"]
trend = "ok"
note = "Use BRP for the intensive/extensive split: it is registered per parcel every year. Do NOT use LGN class 45 (natuurlijk_beheerde_agrarische_graslanden / natuurgraslanden) for trends: LGN maps most of it as agrarisch gras in 2022-2023."

[[concept]]
name = "Nature"
use = ["natura2000_id", "lgn_groep_natuur_open", "lgn_groep_bos", "ndff_soortendiversiteit_klasse"]
trend = "no"
note = "Natura 2000 and NDFF are static; the LGN groups are yearly (see land use)."

[[concept]]
name = "Noise"
use = ["geluid_lden"]
alternatives = ["geluid_lden_2022"]
trend = "no"
note = "Static RIVM maps. Pick ONE edition per game; do not read the difference as change (2022 is 1.8 dB quieter on average, mostly method)."

[[concept]]
name = "Wind turbines"
use = ["wind_aantal", "wind_vermogen_kw", "wind_afstand_min_km"]
alternatives = ["wind_tiphoogte_max_m", "wind_ashoogte_max_m", "wind_rotordiameter_max_m"]
covers = ["wind_*"]
trend = "no"
note = "RIVM turbine register, snapshot January 2026, repeated in every year (no construction year in the source): turbines built after 2018 also appear in the early years. Distance counts turbines of any country, on land and at sea, from the cell centre."

[[concept]]
name = "Main roads and railways (OpenStreetMap)"
use = ["osm_snelweg_lengte_m", "osm_spoor_lengte_m", "osm_metro_tram_lengte_m"]
alternatives = ["osm_autoweg_lengte_m", "osm_provinciaal_lengte_m", "osm_regionaal_lengte_m", "osm_lokaal_lengte_m", "osm_spoor_overig_lengte_m"]
covers = ["osm_snelweg_*", "osm_autoweg_*", "osm_provinciaal_*", "osm_regionaal_*", "osm_lokaal_*", "osm_spoor_*", "osm_metro_tram_*"]
trend = "no"
note = "Latest OSM extract repeated in every year (no history). Metres of line inside the cell (provinciaal / regionaal / lokaal = OSM highway=primary / secondary / tertiary, since 2026-10-20; residential streets are not included); every carriageway and every track counts separately, tunnels included. The lines themselves (whole, with lanes, speed, one-way direction, tunnel/bridge) are in datacube_<region>_lijnen.parquet. Credit: © OpenStreetMap contributors (ODbL)."

[[concept]]
name = "Heat, green, water storage, flooding, ground level"
use = ["hitte", "groenklasse", "waterberging", "flooddepth_1", "groundheight"]
trend = "no"
note = "Static maps: starting conditions, not something that changes with the years in the cube. waterberging = mm of water the soil can still store before it is saturated to ground level ((ground level - mean highest groundwater) x porosity 0.25 x land fraction, RIVM ANK d15, 250 m model cells, groundwater of 1998-2006, map 2014, indicative). Median ~185 mm; > ~2,000 mm only on high ground with deep groundwater (Veluwe, South Limburg): read that as plenty."

[[concept]]
name = "Primary flood defences (Rijkswaterstaat)"
use = ["wk_primair_lengte_m", "wk_norm_signalering_jaar", "wk_lbo1_oordeel", "wk_hwbp_lengte_m"]
alternatives = ["wk_norm_ondergrens_jaar", "wk_hwbp_realisatie_start", "wk_hwbp_realisatie_eind", "wk_hwbp_afgerond_lengte_m"]
covers = ["wk_*"]
trend = "no"
note = "Current state repeated in every year. Norms as return period N (1/N per year; signaleringswaarde = the safety level aimed for, ondergrens = the legal minimum); LBO-1 = first national assessment of the new norms (A+ much safer than required .. D much less safe than the lower limit; 146 of 237 sections C or D). HWBP: dyke stretches in a current reinforcement project with planned construction years (they move with every programme), plus completed projects without a year. Whole lines in datacube_<region>_waterkeringen.parquet. Sea dunes and dams are part of the sections; regional dykes are not included."

[[concept]]
name = "Cloudburst water depth (Klimaateffectatlas)"
use = ["regen_70mm_1h_aandeel_10cm", "regen_70mm_1h_diepte_gem_m"]
alternatives = ["regen_70mm_1h_diepte_max_m", "regen_70mm_1h_aandeel_30cm"]
covers = ["regen_*"]
trend = "no"
note = "Static model: water on the ground after a design shower of 70 mm in 1 hour, current terrain and sewers, 0.5 m pixels read at full resolution. Not flooding from dykes or rivers (flooddepth_* = LIWO). Permanent water is not counted as flooded. Credit: Klimaateffectatlas, 2026 (CC BY 4.0)."

[[concept]]
name = "Subsidence: measured and forecast"
use = ["bodembeweging_mm_jaar", "bodemdaling_2020_2050_hoog_m"]
alternatives = ["bodembeweging_min_mm_jaar", "bodembeweging_ondiep_mm_jaar", "bodemdaling_2020_2050_laag_m"]
covers = ["bodembeweging_*", "bodemdaling_*"]
trend = "no"
note = "Static. bodembeweging_* = measured InSAR ground motion in mm/year (negative = sinking), area-weighted over the Klimaateffectatlas hexagons in the cell; only where InSAR has reflectors (buildings, roads), so meadows and peat land are mostly empty; ondiep = the shallow part (soil compaction, peat oxidation) rather than deep causes (gas, salt). KEA does not state the InSAR source or period (likely EGMS 2019-2023). bodemdaling_2020_2050_* = Deltares forecast of cumulative subsidence by 2050 in m (laag/hoog scenario, 100 m grid), the peat polders of Holland and Friesland up to ~0.5 m."

[[concept]]
name = "Tree canopy per AHN epoch (Klimaateffectatlas)"
use = ["boomkroon_ahn4_aandeel"]
alternatives = ["boomkroon_ahn3_aandeel", "boomkroon_ahn5_aandeel"]
covers = ["boomkroon_*"]
trend = "care"
note = "Share of the cell under tree crowns, from the 0.25 m crown masks the Klimaateffectatlas derived from the national height model (sampled at 1 m), one column per AHN epoch: AHN3 (flown 2014-2019), AHN4 (2020-2022, complete), AHN5 (2023-2025, not complete yet: null where not flown, ~68% of the cells in this edition; a few cells at the flight edge are only partly flown and read too low). Static columns, repeated in every year: the epoch is in the name, not in year_int. Differences between epochs mix real change (felling, planting, growth) with differences in flight season and point density, so compare epochs with care and prefer large changes over small ones. AHN4 is the complete reference. Trees, not all green: for grass and crops use s2_* or lgn_*. Credit: Klimaateffectatlas (CC BY 4.0)."

[[concept]]
name = "Foundation risk: pile rot and uneven settling (Klimaateffectatlas)"
use = ["funderingsrisico_paalrot_huidig_pct", "funderingsrisico_paalrot_2050_hoog_pct"]
alternatives = ["funderingsrisico_paalrot_2050_laag_pct", "funderingsrisico_verschilzetting_2050_laag_pct", "funderingsrisico_verschilzetting_2050_hoog_pct"]
covers = ["funderingsrisico_*"]
trend = "no"
note = "Static model, one value per CBS buurt (area-weighted onto the cell): % of the buurt's buildings at high risk of pile rot (wooden piles that fall dry when groundwater drops) or of uneven settling (shallow foundations on soft soil). Huidig = current climate, 2050 laag/hoog = mild/strong scenario; no current-climate map exists for uneven settling. Map classes: pile rot <0.8 very low, 0.8-3 low, 3-6 moderate, 6-15 high, >15 very high. Credit: Klimaateffectatlas (CC BY 4.0)."

[[concept]]
name = "Crop stress and groundwater, now and 2050 (Klimaateffectatlas)"
use = ["droogtestress_huidig_pct", "grondwater_glg_huidig_m_mv"]
alternatives = ["droogtestress_2050_hoog_pct", "zuurstofstress_huidig_pct", "zuurstofstress_2050_hoog_pct", "grondwater_lg_extreem_droog_huidig_m_mv", "grondwater_glg_verandering_2050_laag_m", "grondwater_glg_verandering_2050_hoog_m"]
covers = ["droogtestress_*", "zuurstofstress_*", "grondwater_*"]
trend = "no"
note = "Static model maps on a 250 m grid (coarser than a res-9 cell: most cells take the value of the pixel at their centre). droogtestress/zuurstofstress = yearly yield loss of grass in % from drought / from waterlogging (null in built-up areas; map classes: drought <10 low, 10-20 moderate, >20 high; waterlogging <15, 15-40, >40). grondwater_glg_huidig_m_mv = mean lowest groundwater level in m below the surface (tens of metres under the Veluwe; negative = above the surface in the model, e.g. water and wet polders); _lg_extreem_droog_ = the level in an extreme dry year; grondwater_glg_verandering_2050_* = CHANGE of that level by 2050 in m, negative = lower groundwater (sign as in the map legend; the high sandy grounds such as the Veluwe rise by 1-2 m in both scenarios through wetter winters). A model, not the BRO measurements. Credit: Klimaateffectatlas (CC BY 4.0)."

[[concept]]
name = "Wildfire risk and flood probability (Klimaateffectatlas)"
use = ["natuurbrandrisico_huidig", "overstromingskans_20cm_huidig_klasse"]
alternatives = ["natuurbrandrisico_2050_hoog", "overstromingskans_20cm_huidig_max_klasse", "overstromingskans_20cm_norm_2050_klasse", "overstromingskans_20cm_2100_klasse"]
covers = ["natuurbrandrisico_*", "overstromingskans_*"]
trend = "no"
note = "Static classes. natuurbrandrisico_* = wildfire risk 1 low, 2 medium, 3 high (250 m; null where nothing can burn), most common in the cell. overstromingskans_20cm_* = chance per year of more than 20 cm of water from dykes, rivers or sea: 0 = no class (the source legend has no 0: not floodable or not computed, e.g. parts of central Amsterdam; read 0 as 'unknown or very small', not as 'safe'), 1 <1/30,000, 2 1/3,000-1/30,000, 3 1/300-1/3,000, 4 1/30-1/300, 5 >1/30; _klasse = most common in the cell, _max_klasse = highest; huidig = today's defences, norm_2050 = all defences at their legal norm in 2050, 2100 = norm plus climate change. Same family as flooddepth_* (LIWO water depths). Res 8/7: most common (max for _max_). Credit: Klimaateffectatlas (CC BY 4.0)."

[[concept]]
name = "Electricity grid congestion (Netbeheer Nederland)"
use = ["net_afname_kleur_max", "net_opwek_kleur_max"]
alternatives = ["net_afname_rood_aandeel", "net_opwek_rood_aandeel", "net_voedingsgebied_id"]
covers = ["net_*"]
trend = "no"
note = "Snapshot of October 2026 repeated in every year. Colour per 6-digit postcode (0 none, 1 yellow, 2 orange, 3 red = no transport capacity, waiting list), offtake (afname) and feed-in (opwek); the colour follows the operator's supply area, so whole districts share it. MW figures (available and needed capacity, waiting list) per supply area in datacube_<region>_netgebieden.parquet; history per gemeente (7 Internet Archive copies 2023-2024, partly national, + own monthly downloads from October 2026) in datacube_<region>_netcongestie.parquet."

[[concept]]
name = "Data centres"
use = ["osm_datacentrum_aantal", "osm_datacentrum_m2"]
covers = ["osm_datacentrum_*"]
trend = "no"
note = "Locations from OpenStreetMap (latest extract, ~100 sites after merging campus and building outlines; no power or opening year). Power, floor area, energy use and opening year come per gemeente and year from RVO's energy-efficiency reports (data year 2025, 104 data centres >= 500 kW; power for 48) in datacube_<region>_datacentra.parquet. Credit: © OpenStreetMap contributors (ODbL)."

[[concept]]
name = "Safety hazards"
use = ["explosieaandachtsgebied", "brandaandachtsgebied", "gifwolkaandachtsgebied"]
trend = "no"
note = "Static (current REV state); true if any risk zone touches the cell."

[[concept]]
name = "Observed change on the ground (satellite, zh only)"
use = ["tessera_change_nonagri_share_dc", "tessera_change_nonagri_mean"]
covers = ["tessera_change_*"]
alternatives = ["tessera_pc01"]
trend = "care"
note = "Drift-corrected share of non-agricultural pixels that changed vs the previous year: construction sites, earthworks, flooding. Not a housing count. Raw _share columns are not comparable between years."

[[concept]]
name = "Administrative areas"
use = ["gemeentecode", "gemeentenaam", "wijkcode", "buurtcode"]
trend = "no"
note = "Wijk- en Buurtkaart 2024, the same boundaries in every year."

[[concept]]
name = "Satellite fingerprint (zh only)"
use = ["tessera_pc01", "tessera_pc02", "tessera_pc03"]
covers = ["tessera_pc*", "tessera_*pixels"]
trend = "no"
note = "16 PCA components of the TESSERA embedding: what a cell looks like, for 'find similar places' WITHIN a year. Province means shift every year with the satellite input, so never use them as a time series; use the change columns for that."

[[concept]]
name = "Migration background / origin"
use = ["percentage_geb_nederland_herkomst_nederland_area_weighted_average", "percentage_geb_nederland_herkomst_buiten_europa_area_weighted_average"]
alternatives = ["percentage_nederlandse_achtergrond_area_weighted_average"]
covers = ["percentage_*achtergr*", "percentage_geb_*"]
trend = "no"
note = "CBS replaced 'migratieachtergrond' (2018-2021) by 'herkomst' (2022 on): two classifications, no series across 2021/2022. 2025 v1 suppresses many squares (lower fill)."

[[concept]]
name = "High-voltage grid, solar parks, marinas (OpenStreetMap)"
use = ["osm_hoogspanning_lengte_m", "osm_onderstation_aantal", "osm_zonnepark_vermogen_kw"]
alternatives = ["osm_hoogspanning_afstand_min_km", "osm_hoogspanning_kabel_lengte_m", "osm_jachthaven_aantal"]
covers = ["osm_hoogspanning_*", "osm_onderstation_*", "osm_zonnepark_*", "osm_jachthaven_*"]
trend = "no"
note = "Latest OSM extract repeated in every year (no history). Only >= 50 kV: overhead lines, cables (less complete) and substations; neighbourhood transformers are left out. Solar park power: about half the parks have no power tag in OSM and are estimated from their area (median kW/ha of the tagged parks). For solar park area over time use zonneparken_fraction (LGN, 2021-2025). Credit: © OpenStreetMap contributors (ODbL)."

[[concept]]
name = "Public charging points (NDW)"
use = ["laad_punten_aantal", "laad_punten_snel_aantal"]
covers = ["laad_*"]
trend = "no"
note = "NDW register of public charging points (all operators), one snapshot repeated in every year: the network grew strongly since 2018, so the early years are far too high. Fast = maximum power >= 50 kW. Private home chargers are not included."

[[concept]]
name = "Climate per year (KNMI)"
use = ["knmi_temp_gem_c", "knmi_neerslag_mm", "knmi_neerslagtekort_max_mm", "knmi_tropische_dagen"]
alternatives = ["knmi_graaddagen", "knmi_zomerse_dagen", "knmi_vorstdagen", "knmi_zware_neerslag_dagen", "knmi_verdamping_mm", "knmi_neerslagtekort_31aug_mm"]
covers = ["knmi_*"]
trend = "ok"
note = "KNMI daily 1 km grids interpolated from station measurements, summed or averaged per calendar year: year-to-year differences are the weather (2018 and 2022 were dry summers; check knmi_neerslagtekort_max_mm). The grid is smooth between stations (temperature from ~35, precipitation from ~300, evaporation from ~32 stations), so local detail below a few km is interpolation, not measurement. Precipitation deficit: KNMI definition, cumulative evaporation minus precipitation from 1 April, maximum up to 30 September; negative in a wet summer. knmi_neerslagtekort_31aug_mm is the same cumulative deficit ON 31 August (end of the Sentinel-2 July-August window), not a maximum. For last summer's weather in 2018: side file datacube_<region>_knmi_voor.parquet has every knmi_* column for 2017 per res-9 cell (same code; at res 8/7 take the area-weighted mean of the children, as coarsen.py does). In 2017 KNMI's precipitation grid (Rd1) misses cells on 29 days, mostly a block over South Limburg on 30 July: the precipitation-based columns (neerslag, zware_neerslag_dagen, both deficits) are null there for 2017 (8,254 cells beyond the usual coast cells), not a silently low sum. 2018-2025 have no such gaps."

[[concept]]
name = "Nitrogen deposition (RIVM)"
use = ["gdn_stikstof_mol_ha"]
alternatives = ["gdn_verzuring_mol_ha", "gcn_nh3_ug_m3"]
covers = ["gdn_*"]
trend = "ok"
note = "RIVM historical series (edition October 2026): 2005-2025 recalculated with one method, so differences between years are real model change, weather included (deposition follows rainfall and wind). Every year uses the SAME spatial distribution of emission sources, only the totals per country, year, sector and substance change (RIVM metadata), then each year is calibrated on that year's measurements: local emission changes (buy-outs, new stables) do NOT show up locally here; compare man_nh3_ug_m3 (measured) for that. 2025 is a provisional calculation (see break). Modelled (OPS) and calibrated on measurements, 1 km: compare with Natura 2000 (natura2000_id) for exceedance. Not the yearly GDN rounds, which RIVM says cannot be strung into a series."

[[concept]]
name = "Ammonia emissions (RIVM Emissieregistratie)"
use = ["nh3_landbouw_kg", "nh3_rundvee_kg", "nh3_varkens_kg", "nh3_pluimvee_kg"]
alternatives = ["nh3_overige_dieren_kg", "nh3_kunstmest_kg", "nh3_totaal_kg"]
covers = ["nh3_*"]
trend = "care"
note = "kg NH3 per cell per year from the national emission register (NEMA: animal counts x emission factors), distributed per 1 km square: stables at the farm location, manure application and grazing over farmland. An animal column holds ALL emissions of that animal's manure (stable, storage, grazing, field application), so it also lands on fields away from the farm. Only 2019-2024 (2018 and 2025 not regionalised). Modelled, and the input of RIVM's deposition (gdn_*): not independent of gdn_* or vee_*. Sums: add cells up (res 8/7 are sums)."

[[concept]]
name = "Ammonia measured (RIVM MAN)"
use = ["man_nh3_ug_m3"]
alternatives = ["man_meetpunten", "man_gebied"]
covers = ["man_*"]
trend = "ok"
note = "Measured yearly mean ammonia concentration from RIVM's Meetnet Ammoniak Nederland (passive samplers): per nature area the mean of its 1-15 points, spread over the whole area; since 2021 also 17 points outside nature (cities, farmland), each in its own cell. Only ~40,000 cells (inside MAN areas) have a value. The one measured counterpart of gcn_nh3_ug_m3 (modelled, calibrated on MAN and LML: per area r 0.83-0.94) and nh3_* (modelled emissions). Year-to-year steps are mostly weather (dry 2018 and 2025 high, wet 2023 low) and areas joining the network (84 areas in 2018, 113 in 2025): compare an area with itself."

[[concept]]
name = "Air quality (RIVM GCN, modelled)"
use = ["gcn_no2_ug_m3", "gcn_pm25_ug_m3"]
alternatives = ["gcn_pm10_ug_m3", "gcn_nh3_ug_m3"]
covers = ["gcn_*"]
trend = "care"
note = "Yearly background concentration maps (1 km), each year its own calculation round. RIVM: the rounds cannot be strung into one series, the calibration on measurements changed over the years (regionally varying since some rounds), so the national decline is real but local trends can be method. NH3 is the ammonia concentration (agriculture) and follows the weather strongly (more evaporation in warm, dry years such as 2022, less in the wet 2021); the 2019 map is the calibrated one of April 2021. For an independent measurement of NO2 use tropomi_no2_1e15_cm2."

[[concept]]
name = "NO2 measured from space (TROPOMI)"
use = ["tropomi_no2_1e15_cm2"]
alternatives = ["tropomi_no2_maanden"]
covers = ["tropomi_*"]
trend = "care"
note = "Sentinel-5P TROPOMI tropospheric NO2 column (KNMI TEMIS monthly means of the reprocessed record, 0.125 degree, ~14 x 9 km): a real measurement, but of the whole column above the cell, not ground-level air, and only regional (Zuid-Holland is ~45 TROPOMI cells). Yearly value = mean of the monthly means; empty for 2018 (record starts May 2018 and winter has the highest NO2) and where fewer than 10 months have a value (clouds, mostly 2019-2021 at the edges). The 2020 dip is COVID."

[[concept]]
name = "Greenness from space (Sentinel-2 NDVI)"
use = ["s2_zomer_gem", "s2_zomer_anomalie", "s2_niet_groen_aandeel", "s2_verstening_aandeel"]
alternatives = ["s2_piek_gem", "s2_groen_aandeel", "s2_vergroening_aandeel", "s2_water_aandeel", "s2_helder_piek", "s2_helder_zomer"]
covers = ["s2_*"]
trend = "ok"
note = "Measured: Sentinel-2 NDVI per 10 m pixel (clouds removed with Cloud Score+ cs_cdf >= 0.60, fixed before any comparison), per pixel first and then a share or mean of the cell's LAND pixels (water from LGN, or NDVI < 0 in >= 75% of the years, is left out). s2_zomer_gem = July-August mean; s2_zomer_anomalie = July-August minus each pixel's own 2018-2025 median: the drought signal, independent of what grows there (national mean follows the KNMI precipitation deficit across the 8 years: r -0.82; 2018 the lowest). s2_niet_groen_aandeel = never green in April-October (buildings, roads, greenhouses, bare sand): r 0.52 with 3D BAG footprint share; greenhouses sit in between. s2_verstening_aandeel = new, lasting loss of green (green in Y-1, not green in Y and Y+1), so empty in 2018 and 2025; 10-18x higher in cells that gain >= 20 BAG addresses between Y-1 and Y+1. Dry summers also lower the peak in built-up cells (urban green browns: 2022, 2025), so never-green rises in dry years without new building. 2025: a third satellite (Sentinel-2C next to 2A/2B) gives ~35% more clear observations (s2_helder_*); peaks of forest and grassland stay inside their 2018-2024 range, so no break. Res 8/7: means weighted by their pixel counts (s2_*_pixels) = the mean over all pixels of the coarse cell; pixels without a clear July-August observation are not in s2_zomer_gem or s2_zomer_pixels. Per land cover inside a cell: datacube_<region>_s2_dekking.parquet (+ _r8 / _r7): one row per cell, year and LGN group of the PIXEL (groep: the 10 LGN groups of lgn_groep_*, plus gemengd = a tie between the 4 LGN 5 m pixels inside a 10 m pixel, and geen_lgn = outside LGN, east of RD x 280 km). Columns s2_zomer_gem / s2_zomer_pixels, s2_zomer_gem_zuiver / s2_zomer_pixels_zuiver (pure pixels only: all 4 LGN pixels in the group; drops field edges and roadsides), s2_piek_gem / s2_land_pixels, s2_zomer_anomalie / s2_anomalie_pixels. Pixels of all groups add up exactly to the cube's s2_*_pixels and their pixel-weighted mean is the cube's value. The group follows LGN of that year, so LGN's own breaks (2021 roads, 2021/2022 grassland and nature remaps, see breaks) move pixels between groups: compare a group with itself within one LGN method, or use the pure pixels."

# --- Known breaks, machine-readable ------------------------------------------------------------------
# One entry per known break: the values of `columns` (globs) in each of `years` are NOT comparable with the
# year before, for the reason in `kind`:
#   method          the source changed how it measures or classifies (LGN remaps)
#   classification  categories redefined (CBS origin, construction periods)
#   definition      same name, new definition (CBS wealth, purchasing power)
#   edition         a new edition or calculation round of the same map, rounds not a series (GCN, NBBG)
#   coverage        the source publishes far fewer areas, the cube fills in (wb incomes)
#   preliminary     provisional figures (CBS 2025 v1)
#   noise           input noise differs per year; no year-to-year comparison
# release.py writes these into availability.parquet (`breaks`, `break_note`) and GUIDE.md, and counts a detected
# step in a matching column and year as documented. The prose notes above explain them for people.

[[break]]
columns = ["lgn_groep_bos", "lgn_groep_natuur_open", "loofbos_fraction", "naaldbos_fraction", "bos_in_*_fraction",
           "kwelders_fraction", "*struikvegetatie*_fraction", "duin*_fraction", "*heide_fraction",
           "gras_in_het_kustgebied_fraction", "open_zand_in_kustgebied_fraction", "rietvegetatie_fraction",
           "overig_gras_fraction", "lgn_groep_overig"]
years = [2021]
kind = "method"
note = "LGN2021 remapped nature, forest and the coast (bos +39%, kwelders x5, struikvegetatie)."

[[break]]
columns = ["lgn_groep_wegen", "wegen_en_spoorwegen_fraction", "smalle_wegen_fraction",
           "hoofdinfrastructuur_en_spoorbaanlichamen_fraction",
           "halfverharde_wegen_infrastructuur_langzaam_verkeer_en_overige_infrastructuur_fraction"]
years = [2021, 2022]
kind = "method"
note = "LGN2021 split roads into 3 classes; LGN2022 maps ~50% more road area."

[[break]]
columns = ["natuurgraslanden_fraction", "natuurlijk_beheerde_agrarische_graslanden_fraction", "agrarisch_gras_fraction",
           "lgn_groep_agrarisch_grasland"]
years = [2022, 2024]
kind = "method"
note = "LGN2022-2023 map most natural grassland (class 45) as agricultural grass; LGN2024 maps it again."

[[break]]
columns = ["percentage_nederlandse_achtergrond_*", "percentage_*_migr_achtergr_*", "percentage_geb_*"]
years = [2022]
kind = "classification"
note = "CBS replaced 'migratieachtergrond' (2018-2021) by 'herkomst' (2022 on): two classifications, no series."

[[break]]
columns = ["aantal_woningen_bouwjaar_15_en_later_sum", "aantal_woningen_bouwjaar_15_tot_25_sum",
           "aantal_woningen_bouwjaar_25_en_later_sum"]
years = [2025]
kind = "classification"
note = "CBS split the newest construction period in 2025 (15_en_later summed back from 15_tot_25 + 25_en_later)."

[[break]]
columns = ["aantal_*_sum", "bijgeschat_*_sum", "cbs_coverage", "percentage_*_area_weighted_average",
           "gemiddelde_woz_waarde_woning_area_weighted_average"]
years = [2025]
kind = "preliminary"
note = "CBS 2025 is the preliminary v1: inhabitants suppressed in 249k squares (2024 v2: 3k; 48k of them had 306k inhabitants in 2024), homes in 303k (2024: 103k). Suppressed squares add 0 to the *_sum columns, so small rural cells drop 20-40% while the national total moves -0.5%; read 2025 per cell as a lower bound. Births not published, ~30% more squares listed. To be replaced by v2 when CBS publishes it."

[[break]]
columns = ["wb_gemiddeld_inkomen_per_inwoner*", "wb_gemiddeld_inkomen_per_inkomensontvanger*",
           "wb_gestandaardiseerd_inkomen_huishoudens*"]
years = [2019]
kind = "coverage"
note = "From 2019 CBS publishes average buurt incomes for only ~14% of buurten; the cube fills from wijk/gemeente."

[[break]]
columns = ["wb_mediaan_vermogen_huishoudens", "wb_perc_huishoudens_lage_koopkracht"]
years = [2022]
kind = "definition"
note = "CBS changed the wealth and purchasing-power definitions in 2022 (vermogen +27%, lage koopkracht -40%)."

[[break]]
columns = ["bbg_*"]
years = [2022]
kind = "edition"
note = "NBBG has two editions: 2018-2021 repeat 2020, 2022-2025 repeat 2022."

[[break]]
columns = ["gcn_*"]
years = [2019, 2020, 2021, 2022, 2023, 2024, 2025]
kind = "edition"
note = "Each GCN year is its own calculation round; RIVM: the rounds cannot be strung into one series."

[[break]]
columns = ["tessera_change_share", "tessera_change_agri_share", "tessera_change_nonagri_share"]
years = [2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025]
kind = "noise"
note = "Raw change shares carry each year pair's own input noise; use tessera_change_nonagri_share_dc for time series."

[[break]]
columns = ["tessera_pc*"]
years = [2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025]
kind = "noise"
note = "PCA components shift every year with the satellite input: compare places within a year, never years."

[[break]]
columns = ["tropomi_*"]
years = [2019]
kind = "coverage"
note = "The TROPOMI record starts in May 2018: 2018 has 8 months (its mean is left empty)."

[[concept]]
name = "Nitrogen vs nature: critical deposition values (KDW)"
use = ["kdw_overschreden_aandeel", "kdw_overschrijding_mol_ha", "kdw_min_mol_ha", "kdw_habitat_m2"]
alternatives = ["kdw_gewogen_mol_ha", "kdw_overschreden_m2", "kdw_habitat_type"]
covers = ["kdw_*"]
trend = "care"
note = "RIVM's map of nitrogen-sensitive Natura 2000 habitats (1 ha AERIUS hexagons, 2026 monitor) with the critical deposition value (KDW) per habitat type; the habitat map is one state, repeated in every year. Exceedance per year compares the RIVM historical deposition series (1 km) with the KDW at each hexagon, so year-to-year changes are deposition changes (incl. weather), not habitat change. Nationally 2024: 71.1% of the relevant area above its KDW here vs 69.3% in RIVM's own 1 ha calculation; local values differ more. Empty = no relevant habitat in the cell."

[[concept]]
name = "Livestock (CBS census per gemeente, spread over farmland)"
use = ["vee_rundvee", "vee_melkkoeien", "vee_varkens", "vee_kippen", "vee_bedrijven_graasdieren", "vee_bedrijven_hokdieren"]
alternatives = ["vee_schapen", "vee_geiten", "vee_paarden", "vee_overig_pluimvee", "vee_bedrijven_rundvee", "vee_bedrijven_varkens", "vee_bedrijven_kippen"]
covers = ["vee_*"]
trend = "care"
note = "CBS agricultural census (table 80781ned, animals on 1 April) per gemeente, spread over that year's farmland (BRP): grazing animals over grass + maize + fodder crops, housed animals (pigs, poultry) over all farmland. A cell shows a plausible density, NOT a real farm: farm-level animal counts are not open data, and CBS counts animals in the gemeente of the farm's registered seat. Gemeente totals are exact (NL cattle 3.92 M in 2018 -> 3.64 M in 2025, pigs 12.4 M -> 9.8 M). Farm counts (vee_bedrijven_*) are spread the same way: fractions of farms per cell. Trend: gemeente mergers change the spreading area between years; sum over gemeenten or coarser for trends. Horses are empty in 2022 (not published), and from 2024 the per-animal farm counts (vee_bedrijven_kippen, _varkens, _rundvee) are 0 in many gemeenten that still have those animals (CBS change): use the animal counts or the totals vee_bedrijven_graasdieren / _hokdieren."

[[break]]
columns = ["vee_paarden"]
years = [2022, 2023]
kind = "coverage"
note = "CBS published no horse/pony counts for 2022 (its table has 0 in every gemeente; null in the cube)."

[[break]]
columns = ["vee_bedrijven_kippen", "vee_bedrijven_varkens", "vee_bedrijven_rundvee", "vee_bedrijven_graasdieren", "vee_bedrijven_hokdieren"]
years = [2024]
kind = "definition"
note = "From 2024 CBS reports 0 farms in >100 gemeenten that still report pigs or chickens (~30 for cattle, ~20 for grazing animals): those gemeenten are null in the cube, so national farm totals from 2024 are too low and not comparable; the animal counts are."

[[break]]
columns = ["gemiddeld_gasverbruik_woning_area_weighted_average", "wb_gemiddeld_gasverbruik"]
years = [2019]
kind = "method"
note = "SUSPECTED, not confirmed by CBS: gas per home falls ~7% from 2018 to 2019 (CBS 81528NED national 1,270 -> 1,180 m3; the cube's stable-stock cells -6.9%) with the same heating degree days (knmi_graaddagen 2,660 both years), while CBS's energy balance (83989NED, homes) falls only 3.5%. CBS renewed its customer-file method with series starting in 2019 (publication 'Energielevering aardgaswoningen 2019-2021 (vernieuwd)', 2022) and 81528NED lacks the district-heating share for 2018 alone. Don't read 2018 -> 2019 as savings."

[[break]]
columns = ["gdn_stikstof_mol_ha", "gdn_verzuring_mol_ha", "kdw_overschreden_aandeel", "kdw_overschreden_m2", "kdw_overschrijding_mol_ha"]
years = [2025]
kind = "preliminary"
note = "RIVM: 2025 in the historical series is a provisional calculation on that year's measurements and weather; emission data for 2025 were still missing, so RIVM leaves it out of its trend analysis. Lower mainly because 2025 was dry (less wet deposition); no structural conclusions (Monitor stikstofdepositie in Natura 2000-gebieden 2026, RIVM-2026-0018). The yearly KDW exceedance is computed from it."
