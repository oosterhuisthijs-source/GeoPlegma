# CBS vierkantstatistieken 100m -> H3 res 9: per-column aggregation rules.
#
# Ported from datacube's cbs/config/cbs_config.yaml (the Databricks pipeline),
# with the renames flattened to point straight at the final name (the original
# chained some, e.g. 2018 -> 2019 name -> 2020+ name).
#
# Output column = "<name>_<aggregation>", e.g. aantal_inwoners_sum, matching
# the column names of the ruimtelijke-assistent volledige_tijdreeks table.
# Values are real (unnormalized); see the `export` step for the 0-255 version.

# Numeric values <= this are CBS reserved codes (-99997 = "geheim"/suppressed;
# CBS documents a few more in the -9999x range) and become null.
sentinel_threshold = -99990.0

# Percentages above 100 occur in the CBS source itself (2018-2020: up to 160
# for percentage_koopwoningen) and are treated as invalid (null).
percentage_max = 100.0

# Pairs that sum to exactly 100 in every square where both are published
# (verified on 2023: koop + huur = 100 in all squares). When CBS suppressed
# one of them (~28k of ~79k squares), it is filled as 100 - the other, so the
# hex averages of both run over the same squares and still add up to ~100.
complements = [["percentage_koopwoningen", "percentage_huurwoningen"]]

# String values treated as null before taking the mode.
null_strings = ["onclassificeerbaar"]

# Categorical columns also made numeric as the midpoint of their leading range:
# the CBS income class "40-80 midden tot boven midden" (the square's median
# household falls in the 40th-80th percentile of the national household
# income distribution) -> 60. Aggregated like any other numeric column (see
# area_weighted_average); the class itself is kept as `_mode`.
category_midpoints = ["mediaan_inkomen_huishouden"]

