# Static (non-yearly) layers -> H3 res 9.
#
# Read by both `prepare/static.py` (fetching: the `wcs`/`wfs`/`gpkg` keys) and
# `datacube-zh static` (aggregation: `agg`, `nodata`, ...). Each layer writes
# one output column named `name` (or, for `mode` with `label`, two columns).
#
# Raster layers are fetched over WCS 2.0.1 in EPSG:28992, warped to lon/lat,
# and aggregated by mapping every pixel centre to its hex with geoplegma's
# `zone_from_point`.
#   agg = "mean" | "min" | "max" | "mode"
#   nodata      = source values treated as "no data"
#   nodata_fill = value nodata pixels count as (omit: they are skipped).
#                 For flood depth "no data" means "does not flood", i.e. 0.
#   valid_max   = values above this are source errors: skipped, NOT filled (a hex with only such pixels is null)
#   resolution  = fetch resolution in metres (omit: native)
#   tile_m      = WCS tile size in metres (omit: 4000 output pixels); for servers that limit the source read
#   Hexes that contain no pixel centre (rasters coarser than ~300m) take the
#   value of the pixel under the hex centre instead.
#
# Vector layers are fetched over WFS (or from a GeoPackage) and overlaid on
# the hexes with the polygon overlay engine.
#   agg = "any"  -> true if any source polygon overlaps the hex (several
#                   `layers` are unioned, e.g. basisnet + buisleidingen +
#                   stationaire bronnen)
#   agg = "mode" -> attribute `column` of the polygon covering most of the hex

# --- AHN ---------------------------------------------------------------------

[[raster]]
name = "groundheight"
description = "Maaiveldhoogte t.o.v. NAP (m), AHN4 DTM 0.5m resampled to 5m"
unit = "m NAP"
wcs = "https://service.pdok.nl/rws/ahn/wcs/v1_0"
coverage = "dtm_05m"
resolution = 5
agg = "mean"
nodata = [3.4028234663852886e38, -9999]

